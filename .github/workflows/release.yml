name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-14
            target: aarch64-apple-darwin
          - runs-on: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: brew install libvpx libyuv

      - name: Build release binary
        run: cargo build --release -p cli --target ${{ matrix.target }}

      - name: Package binary
        run: tar czf castkit-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release castkit

      - name: Generate SHA256
        run: shasum -a 256 castkit-${{ matrix.target }}.tar.gz > castkit-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: castkit-${{ matrix.target }}
          path: |
            castkit-${{ matrix.target }}.tar.gz
            castkit-${{ matrix.target }}.tar.gz.sha256

  release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
