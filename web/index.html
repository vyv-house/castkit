<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Share — Rooms</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #0f3460;
    --accent-hover: #1a4a7a;
    --text: #e4e4e4;
    --text-muted: #a0a0b0;
    --success: #2ecc71;
    --danger: #e74c3c;
    --radius: 12px;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --transition: 0.25s ease;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans", "Noto Sans CJK KR", sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 32px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #0f3460 0%, #1a4a7a 100%);
    display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff;
    box-shadow: 0 4px 12px rgba(15,52,96,0.45);
  }
  .brand h1 { margin: 0; font-size: 22px; letter-spacing: 0.2px; }
  .sub { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 14px;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
    text-decoration: none;
  }
  .btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow); }
  .btn.primary { background: var(--accent); border-color: rgba(255,255,255,0.12); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.viewer {
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 700;
    background: linear-gradient(135deg, #1a4a7a 0%, #0f3460 100%);
    box-shadow: 0 10px 24px rgba(15,52,96,0.28);
  }
  .btn.viewer:hover { background: linear-gradient(135deg, #215b92 0%, #1a4a7a 100%); }

  main { padding: 28px 32px; }
  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px;
  }
  .count { color: var(--text-muted); font-size: 14px; }
  .toolbar-actions { display: flex; gap: 10px; align-items: center; }
  .spinner {
    width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.15);
    border-top-color: var(--text); border-radius: 50%;
    animation: spin 0.8s linear infinite; display: none;
  }
  .spinner.active { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .room-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    position: relative; overflow: hidden;
  }
  .room-card-link {
    display: block;
    color: inherit;
    text-decoration: none;
  }
  .room-card::before {
    content: ''; position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(135deg, rgba(15,52,96,0.25), rgba(26,74,122,0.15));
    transition: opacity var(--transition); pointer-events: none;
  }
  .room-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: rgba(255,255,255,0.12); }
  .room-card:hover::before { opacity: 1; }
  .room-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .room-id { font-weight: 700; font-size: 16px; letter-spacing: 0.2px; }
  .badge {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
    padding: 4px 8px; border-radius: 999px; background: rgba(46,204,113,0.15); color: var(--success); border: 1px solid rgba(46,204,113,0.25);
  }
  .room-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .room-metrics {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.07);
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .metric-pill {
    color: #c8d8ff;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta-item { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; }
  .meta-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .meta-dot.green { background: var(--success); box-shadow: 0 0 6px rgba(46,204,113,0.5); }
  .meta-dot.red { background: var(--danger); box-shadow: 0 0 6px rgba(231,76,60,0.5); }

  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 64px 24px; color: var(--text-muted); text-align: center;
  }
  .empty h2 { margin: 0 0 8px; font-size: 20px; color: var(--text); }
  .empty p { margin: 0; font-size: 14px; }

  .error-toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--danger); color: #fff; padding: 12px 16px; border-radius: 10px;
    box-shadow: var(--shadow); font-size: 14px; opacity: 0; transform: translateY(8px);
    transition: opacity var(--transition), transform var(--transition); pointer-events: none;
  }
  .error-toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }

  @media (max-width: 640px) {
    header { padding: 16px 18px; flex-direction: column; align-items: flex-start; gap: 10px; }
    .actions { width: 100%; justify-content: flex-start; }
    main { padding: 16px 18px; }
    .toolbar { flex-direction: column; align-items: flex-start; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-icon">S</div>
    <div>
      <h1>Screen Share</h1>
      <div class="sub">Live room directory</div>
    </div>
  </div>
  <div class="actions">
    <div class="spinner" id="spinner"></div>
    <a class="btn primary viewer" href="viewer.html">Open Viewer</a>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="count" id="count">Loading rooms…</div>
    <div class="toolbar-actions">
      <a class="btn" href="viewer.html">Watch All</a>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <h2>No active rooms</h2>
    <p>Rooms will appear here once streamers go live.</p>
  </div>
</main>

<div class="error-toast" id="toast"></div>

<script>
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const countEl = document.getElementById('count');
const spinner = document.getElementById('spinner');
const toast = document.getElementById('toast');

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function renderCard(room) {
  const card = document.createElement('a');
  card.className = 'room-card room-card-link';
  card.href = `viewer.html?rooms=${encodeURIComponent(room.id)}`;
  const width = Number(room.width) || 0;
  const height = Number(room.height) || 0;
  const watchers = Number(room.watchers) || 0;
  const metrics = room.metrics || {};
  const packets = Number(metrics.packets_received) || 0;
  const keyframes = Number(metrics.keyframes_received) || 0;
  const bytes = Number(metrics.bytes_received) || 0;
  const keyframeRequests = Number(metrics.force_keyframe_requests) || 0;
  const lagEvents = Number(metrics.watcher_lag_events) || 0;
  const laggedFrames = Number(metrics.watcher_lagged_frames) || 0;
  const uptimeMs = Number(metrics.uptime_ms) || 0;
  const packetsPerSecond = uptimeMs > 0 ? (packets / (uptimeMs / 1000)).toFixed(1) : '0.0';
  const active = room.active ? 'green' : 'red';
  const label = room.active ? 'Active' : 'Inactive';
  card.innerHTML = `
    <div class="room-header">
      <div class="room-id">${escapeHtml(room.id)}</div>
      <div class="badge">${label}</div>
    </div>
    <div class="room-meta">
      <div class="meta-item"><span class="meta-dot ${active}"></span>${width}×${height}</div>
      <div class="meta-item"><span class="meta-dot ${active}"></span>${watchers} watcher${watchers === 1 ? '' : 's'}</div>
    </div>
    <div class="room-metrics" aria-label="Room telemetry">
      <div class="metric-pill">${packetsPerSecond} pkt/s avg</div>
      <div class="metric-pill">${formatBytes(bytes)} received</div>
      <div class="metric-pill">${packets} packets · ${keyframes} key</div>
      <div class="metric-pill">${keyframeRequests} kf req</div>
      <div class="metric-pill">${lagEvents} lag events</div>
      <div class="metric-pill">${laggedFrames} lagged frames</div>
    </div>
  `;
  return card;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[c]));
}

function formatBytes(bytes) {
  if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
  const units = ['B', 'KiB', 'MiB', 'GiB'];
  let value = bytes;
  let unit = 0;
  while (value >= 1024 && unit < units.length - 1) {
    value /= 1024;
    unit += 1;
  }
  return `${value >= 10 ? value.toFixed(0) : value.toFixed(1)} ${units[unit]}`;
}

async function load() {
  spinner.classList.add('active');
  try {
    const res = await fetch('/api/rooms');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rooms = await res.json();
    spinner.classList.remove('active');
    grid.innerHTML = '';
    if (!rooms || rooms.length === 0) {
      empty.style.display = 'flex';
      countEl.textContent = '0 rooms';
      return;
    }
    empty.style.display = 'none';
    countEl.textContent = `${rooms.length} room${rooms.length === 1 ? '' : 's'}`;
    for (const room of rooms) {
      grid.appendChild(renderCard(room));
    }
  } catch (e) {
    spinner.classList.remove('active');
    showToast('Failed to load rooms: ' + e.message);
    countEl.textContent = 'Unable to load';
  }
}

load();
setInterval(load, 3000);
</script>
</body>
</html>
