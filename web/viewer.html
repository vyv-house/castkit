<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Share — Viewer</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --accent: #0f3460;
    --accent-hover: #1a4a7a;
    --text: #e4e4e4;
    --text-muted: #a0a0b0;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    height: 100%;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-direction: row;
    padding: 12px 18px;
    background: var(--panel);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    gap: 12px;
    flex-wrap: wrap;
  }

  .topbar-left,
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  #grid-container {
    flex: 1;
    overflow: hidden;
  }

  #grid-container:fullscreen {
    background: var(--bg);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--text);
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.08);
    transition: background 0.2s ease, transform 0.2s ease;
    text-decoration: none;
    font: inherit;
    font-size: 13px;
  }

  .btn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  input#add-room-input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    outline: none;
    width: 160px;
    font: inherit;
  }

  input#add-room-input::placeholder {
    color: rgba(228,228,228,0.45);
  }

  input#add-room-input:focus {
    border-color: rgba(255,255,255,0.24);
  }

  .toggle-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-muted);
    user-select: none;
  }

  .room-count {
    font-size: 13px;
    color: var(--text-muted);
    background: rgba(255,255,255,0.04);
    padding: 6px 10px;
    border-radius: 8px;
  }

  @media (max-width: 720px) {
    .topbar {
      align-items: stretch;
      padding: 10px 12px;
    }

    .topbar-left,
    .topbar-right {
      width: 100%;
    }

    input#add-room-input {
      flex: 1;
      min-width: 0;
    }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="btn">← Rooms</a>
      <span class="room-count">0 streams</span>
    </div>
    <div class="topbar-right">
      <input type="text" id="add-room-input" placeholder="Room ID..." />
      <button id="add-room-btn" class="btn">+ Add</button>
      <label class="toggle-label">
        <input type="checkbox" id="auto-add-toggle" />
        Auto-add
      </label>
      <button id="fs-btn" class="btn">⛶ Fullscreen</button>
    </div>
  </div>
  <div id="grid-container"></div>
  <script type="module">
    import { MonitorGrid } from './js/grid.js';
    import { StreamManager } from './js/app.js';

    const container = document.getElementById('grid-container');
    const grid = new MonitorGrid(container);
    const manager = new StreamManager(grid, window.location.host);

    // URL params
    const params = new URLSearchParams(window.location.search);
    const rooms = params.get('rooms') || params.get('room');
    if (rooms) {
      rooms.split(',').map(id => id.trim()).filter(Boolean).forEach(id => manager.addStream(id, { pinned: true }));
    }

    // Auto-add toggle
    const autoToggle = document.getElementById('auto-add-toggle');
    autoToggle.addEventListener('change', () => {
      if (autoToggle.checked) manager.startAutoAdd();
      else manager.stopAutoAdd();
    });
    // If no rooms specified, enable auto-add by default
    if (!rooms) {
      autoToggle.checked = true;
      manager.startAutoAdd();
    }

    // Add room manually
    document.getElementById('add-room-btn').addEventListener('click', () => {
      const input = document.getElementById('add-room-input');
      const id = input.value.trim();
      if (id) { manager.addStream(id, { pinned: true }); input.value = ''; }
    });
    document.getElementById('add-room-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('add-room-btn').click();
    });

    // Update room count
    setInterval(() => {
      const count = container.querySelectorAll('.monitor-panel').length;
      document.querySelector('.room-count').textContent = count + ' stream' + (count !== 1 ? 's' : '');
    }, 1000);

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      const editable = e.target.closest('input, textarea, [contenteditable="true"]');
      if (editable) return;

      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.getElementById('grid-container').requestFullscreen().catch(()=>{});
        else document.exitFullscreen();
      }
      if (e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        document.getElementById('add-room-input').focus();
      }
    });

    // Fullscreen button
    document.getElementById('fs-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) document.getElementById('grid-container').requestFullscreen().catch(()=>{});
      else document.exitFullscreen();
    });
  </script>
</body>
</html>
